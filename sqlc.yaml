version: "2"
sql:
  - schema: "sql/migrations"   # a mesma pasta do Goose
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: database
        out: internal/database
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

        
